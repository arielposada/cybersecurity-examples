<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat vs Junk Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --page: #1d2550;
            --ink: #111111;
            --paper: #fffdf4;
            --yellow: #ffd23f;
            --red: #ff3b3b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--page);
            background-image: radial-gradient(rgba(255,255,255,0.08) 1.5px, transparent 1.6px);
            background-size: 14px 14px;
            color: var(--paper);
            font-family: "Bangers", Impact, "Arial Black", sans-serif;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .stage { width: min(960px, 100%); }
        .hud {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 54px;
            padding-bottom: 10px;
        }
        .timer {
            background: var(--paper);
            color: var(--ink);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 1.9rem;
            padding: 2px 14px;
            min-width: 7.2ch;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .message {
            background: var(--red);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 1.6rem;
            padding: 2px 14px;
            transform: rotate(-3deg);
            display: none;
        }
        .message.show { display: block; }
        .frame {
            border: 4px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink), 0 0 0 3px var(--yellow);
            line-height: 0;
        }
        canvas { width: 100%; height: auto; display: block; }
        .controls {
            margin-top: 16px;
            text-align: center;
            font-size: 1.15rem;
            color: #cfd6ff;
        }
        .key {
            display: inline-block;
            background: var(--paper);
            color: var(--ink);
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--yellow);
            padding: 0 9px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="hud">
            <div class="timer" id="timer">00:00.00</div>
            <div class="message" id="message" role="status">Game over!</div>
        </div>
        <div class="frame">
            <canvas id="game" width="960" height="540"></canvas>
        </div>
        <div class="controls">
            Move with <span class="key">A</span><span class="key">D</span> or <span class="key">&larr;</span><span class="key">&rarr;</span>.
            Dodge the junk food and grab the hearts.
        </div>
    </div>

    <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const timerEl = document.getElementById("timer");
    const messageEl = document.getElementById("message");
    const VW = canvas.width, VH = canvas.height;
    const GROUND = 458;                       // where the cat's feet touch the sidewalk

    // ---------------- Images (relative paths) -----------------------------
    const IMAGE_FILES = {
        city: "./images/city.png",
        food: "./images/junk_food.png",
        heart: "./images/heart.png",
        frames: [1, 2, 3, 4, 5].map(n => `./images/cat/frame_${n}.png`)
    };
    const loadImage = (src) => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Unable to load ${src}`));
        img.src = src;
    });

    // ---------------- Settings --------------------------------------------
    const SRC = { x: 0, y: 118, w: 166, h: 252 };   // cat area inside each frame
    const CAT_H = 92, CAT_W = SRC.w * CAT_H / SRC.h;
    const BODY_CENTER = 95 / 166;
    const CAT_HIT = { w: 34, h: 74 };               // a bit smaller than the drawing
    const CAT_SPEED = 380;                          // px per second
    const WALK_FPS = 10;

    const START_LIVES = 3, MAX_LIVES = 7;
    const HURT_TIME = 1.0;                          // blinking time after a hit

    const FOOD_W = 84, FOOD_H = FOOD_W * 130 / 160;
    const FOOD_HIT_INSET = 12;
    const HEART_W = 46, HEART_H = HEART_W * 58 / 64;

    // Difficulty grows for 60 seconds, then stays at the limit
    const RAMP_TIME = 60;
    const FOOD_EVERY = { start: 1.15, limit: 0.45 };   // seconds between foods
    const FOOD_SPEED = { start: 210, limit: 400 };     // falling speed
    const HEART_EVERY = { min: 9, max: 16 };           // hearts are much rarer
    const HEART_SPEED = 190;

    // ---------------- State -----------------------------------------------
    let images;
    let state = "ready";     // ready | playing | over
    let cat, lives, elapsed, foods, hearts, foodTimer, heartTimer;
    const keys = { left: false, right: false };

    const rand = (a, b) => a + Math.random() * (b - a);
    const lerp = (a, b, t) => a + (b - a) * t;

    function reset() {
        cat = { x: VW / 2, facingLeft: false, frame: 0, walkTimer: 0, hurt: 0 };
        lives = START_LIVES;
        elapsed = 0;
        foods = [];
        hearts = [];
        foodTimer = 0.8;
        heartTimer = rand(HEART_EVERY.min, HEART_EVERY.max);
        messageEl.classList.remove("show");
    }

    // ---------------- Input -----------------------------------------------
    function setKey(e, down) {
        const k = e.key.toLowerCase();
        if (k === "a" || e.key === "ArrowLeft") keys.left = down;
        else if (k === "d" || e.key === "ArrowRight") keys.right = down;
        else return false;
        e.preventDefault();
        return true;
    }
    window.addEventListener("keydown", (e) => {
        if (setKey(e, true) && state === "ready") state = "playing";
        if (e.key === "Enter" && state === "over") { reset(); state = "ready"; }
    });
    window.addEventListener("keyup", (e) => setKey(e, false));
    window.addEventListener("blur", () => { keys.left = keys.right = false; });

    // ---------------- Update ----------------------------------------------
    function difficulty() { return Math.min(1, elapsed / RAMP_TIME); }

    function catBox() {
        return { x: cat.x - CAT_HIT.w / 2, y: GROUND - CAT_HIT.h, w: CAT_HIT.w, h: CAT_HIT.h };
    }
    function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function update(dt) {
        if (state !== "playing") return;
        elapsed += dt;
        const d = difficulty();

        // move the cat
        let dir = 0;
        if (keys.left && !keys.right) dir = -1;
        if (keys.right && !keys.left) dir = 1;
        cat.x = Math.max(CAT_W / 2, Math.min(VW - CAT_W / 2, cat.x + dir * CAT_SPEED * dt));
        if (dir !== 0) {
            cat.facingLeft = dir < 0;
            cat.walkTimer += dt;
            if (cat.walkTimer >= 1 / WALK_FPS) { cat.walkTimer = 0; cat.frame = (cat.frame + 1) % images.frames.length; }
        } else {
            cat.frame = 0; cat.walkTimer = 0;
        }
        cat.hurt = Math.max(0, cat.hurt - dt);

        // spawn junk food
        foodTimer -= dt;
        if (foodTimer <= 0) {
            foods.push({
                x: rand(6, VW - FOOD_W - 6),
                y: -FOOD_H,
                speed: lerp(FOOD_SPEED.start, FOOD_SPEED.limit, d) * rand(0.85, 1.15),
                spin: rand(-0.15, 0.15)
            });
            foodTimer = lerp(FOOD_EVERY.start, FOOD_EVERY.limit, d) * rand(0.7, 1.3);
        }

        // spawn a heart now and then (never when lives are full)
        if (lives < MAX_LIVES) {
            heartTimer -= dt;
            if (heartTimer <= 0) {
                hearts.push({ x: rand(10, VW - HEART_W - 10), y: -HEART_H, t: 0 });
                heartTimer = rand(HEART_EVERY.min, HEART_EVERY.max);
            }
        }

        const box = catBox();

        // move food + hits
        for (let i = foods.length - 1; i >= 0; i--) {
            const f = foods[i];
            f.y += f.speed * dt;
            const hit = { x: f.x + FOOD_HIT_INSET, y: f.y + FOOD_HIT_INSET, w: FOOD_W - FOOD_HIT_INSET * 2, h: FOOD_H - FOOD_HIT_INSET * 2 };
            if (overlaps(box, hit)) {
                foods.splice(i, 1);
                if (cat.hurt <= 0) {
                    lives--;
                    cat.hurt = HURT_TIME;
                    if (lives <= 0) { gameOver(); return; }
                }
            } else if (f.y > GROUND + 10) {
                foods.splice(i, 1);           // missed the cat, hit the sidewalk
            }
        }

        // move hearts + pickups
        for (let i = hearts.length - 1; i >= 0; i--) {
            const h = hearts[i];
            h.y += HEART_SPEED * dt;
            h.t += dt;
            const hb = { x: h.x + 4, y: h.y + 4, w: HEART_W - 8, h: HEART_H - 8 };
            if (overlaps(box, hb)) {
                hearts.splice(i, 1);
                lives = Math.min(MAX_LIVES, lives + 1);
            } else if (h.y > GROUND + 10) {
                hearts.splice(i, 1);
            }
        }
        if (lives >= MAX_LIVES) hearts.length = 0;   // full: no hearts on screen
    }

    function gameOver() {
        state = "over";
        lives = 0;
        keys.left = keys.right = false;
        messageEl.classList.add("show");
    }

    // ---------------- Render ----------------------------------------------
    function banner(title, subtitle, color) {
        ctx.save();
        ctx.textAlign = "center";
        const w = 460, h = 112, x = VW / 2 - w / 2, y = 150;
        ctx.fillStyle = "#111"; ctx.fillRect(x + 6, y + 6, w, h);
        ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
        ctx.lineWidth = 4; ctx.strokeStyle = "#111"; ctx.strokeRect(x, y, w, h);
        ctx.font = `52px Bangers, Impact, "Arial Black", sans-serif`;
        ctx.lineWidth = 6; ctx.fillStyle = "#fffdf4";
        ctx.strokeText(title, VW / 2, y + 58); ctx.fillText(title, VW / 2, y + 58);
        ctx.font = `24px Bangers, Impact, "Arial Black", sans-serif`;
        ctx.fillStyle = "#111"; ctx.fillText(subtitle, VW / 2, y + 94);
        ctx.restore();
    }

    function render() {
        ctx.drawImage(images.city, 0, 0, VW, VH);

        // hearts falling (gentle sway)
        for (const h of hearts) {
            ctx.drawImage(images.heart, h.x + Math.sin(h.t * 4) * 6, h.y, HEART_W, HEART_H);
        }

        // cat (blinks after a hit)
        const blinkHidden = cat.hurt > 0 && Math.floor(cat.hurt * 12) % 2 === 0;
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath(); ctx.ellipse(cat.x, GROUND + 2, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
        if (!blinkHidden) {
            ctx.save();
            ctx.imageSmoothingQuality = "high";
            ctx.translate(cat.x, GROUND + 1);
            if (cat.facingLeft) ctx.scale(-1, 1);
            ctx.drawImage(images.frames[cat.frame], SRC.x, SRC.y, SRC.w, SRC.h, -CAT_W * BODY_CENTER, -CAT_H, CAT_W, CAT_H);
            ctx.restore();
        }

        // junk food
        for (const f of foods) {
            ctx.save();
            ctx.translate(f.x + FOOD_W / 2, f.y + FOOD_H / 2);
            ctx.rotate(Math.sin(f.y / 60) * f.spin * 2);
            ctx.drawImage(images.food, -FOOD_W / 2, -FOOD_H / 2, FOOD_W, FOOD_H);
            ctx.restore();
        }

        // lives in the top-left corner
        const size = 34, hh = size * 58 / 64;
        ctx.save();
        ctx.fillStyle = "rgba(255,253,244,0.9)";
        ctx.strokeStyle = "#111"; ctx.lineWidth = 3;
        const panelW = 14 + MAX_LIVES * (size + 6);
        ctx.fillRect(12, 12, panelW, hh + 16); ctx.strokeRect(12, 12, panelW, hh + 16);
        for (let i = 0; i < MAX_LIVES; i++) {
            ctx.globalAlpha = i < lives ? 1 : 0.15;
            ctx.drawImage(images.heart, 20 + i * (size + 6), 20, size, hh);
        }
        ctx.restore();

        if (state === "ready") banner("Cat vs Junk Food", "Press A, D or an arrow key to start", "#3a86ff");
        if (state === "over") banner("Game over!", "Press Enter to play again", "#ff3b3b");

        const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60), cs = Math.floor((elapsed * 100) % 100);
        timerEl.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
    }

    // ---------------- Loop ------------------------------------------------
    let last = 0;
    function loop(ts) {
        const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
        last = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
    }

    Promise.all([
        loadImage(IMAGE_FILES.city),
        loadImage(IMAGE_FILES.food),
        loadImage(IMAGE_FILES.heart),
        Promise.all(IMAGE_FILES.frames.map(loadImage))
    ]).then(([city, food, heart, frames]) => {
        images = { city, food, heart, frames };
        reset();
        requestAnimationFrame(loop);
        if (document.fonts) document.fonts.ready.then(render);
    }).catch((err) => {
        console.error(err);
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, VW, VH);
        ctx.fillStyle = "#111"; ctx.font = "20px sans-serif";
        ctx.fillText("Images not found. Keep the images folder next to this HTML file.", 30, 50);
    });

    // for testing
    window.__dodge = { update, get state() { return state; }, get lives() { return lives; }, set lives(v) { lives = v; }, get foods() { return foods; }, get hearts() { return hearts; }, get cat() { return cat; }, start() { reset(); state = "playing"; } };
    </script>
</body>
</html>

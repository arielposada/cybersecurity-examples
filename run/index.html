<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Dash: City Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --page: #1d2550;
            --ink: #111111;
            --paper: #fffdf4;
            --yellow: #ffd23f;
            --red: #ff3b3b;
            --sky: #7fd3ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--page);
            background-image: radial-gradient(rgba(255,255,255,0.08) 1.5px, transparent 1.6px);
            background-size: 14px 14px;
            color: var(--paper);
            font-family: "Bangers", Impact, "Arial Black", sans-serif;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .stage { width: min(960px, 100%); }
        .hud {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            min-height: 54px;
            padding-bottom: 10px;
        }
        .timer {
            background: var(--paper);
            color: var(--ink);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 1.9rem;
            padding: 2px 14px;
            min-width: 7.2ch;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .best { font-size: 1.2rem; color: var(--yellow); }
        .message {
            background: var(--red);
            color: var(--paper);
            border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 1.6rem;
            padding: 2px 14px;
            transform: rotate(-3deg);
            display: none;
        }
        .message.show { display: block; }
        .frame {
            border: 4px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink), 0 0 0 3px var(--yellow);
            line-height: 0;
            background: var(--sky);
        }
        canvas { width: 100%; height: auto; display: block; }
        .controls {
            margin-top: 16px;
            text-align: center;
            font-size: 1.15rem;
            color: #cfd6ff;
        }
        .key {
            display: inline-block;
            background: var(--paper);
            color: var(--ink);
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0 var(--yellow);
            padding: 0 10px;
            margin: 0 4px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="hud">
            <div class="timer" id="timer">00:00.00</div>
            <div class="message" id="message" role="status">Game over!</div>
            <div class="best" id="best"></div>
        </div>
        <div class="frame">
            <canvas id="gameCanvas" width="960" height="420"></canvas>
        </div>
        <div class="controls">Press <span class="key">Space</span> to jump. Dodge the yellow obstacles for as long as you can.</div>
    </div>

            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;

        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
    }

    // ---------------- Comic city scenery (drawn once) ------------------
    const OUTLINE = "#111111";
    function halftone(g, x, y, w, h, color, step = 7, maxR = 2.4, fade = "right") {
        g.save();
        g.beginPath(); g.rect(x, y, w, h); g.clip();
        g.fillStyle = color;
        for (let yy = y; yy < y + h + step; yy += step) {
            for (let xx = x + ((yy / step) % 2 ? step / 2 : 0); xx < x + w + step; xx += step) {
                let t = fade === "right" ? (xx - x) / w : fade === "down" ? (yy - y) / h : 1;
                const r = maxR * Math.max(0, Math.min(1, t));
                if (r > 0.3) { g.beginPath(); g.arc(xx, yy, r, 0, Math.PI * 2); g.fill(); }
            }
        }
        g.restore();
    }
    function makeLayer(width, height, draw) {
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        draw(c.getContext("2d"), width, height);
        return c;
    }
    function cloud(g, x, y, s) {
        g.fillStyle = "#ffffff"; g.strokeStyle = OUTLINE; g.lineWidth = 3;
        const puffs = [[0, 0, 28], [30, -14, 30], [62, -4, 26], [88, 6, 20], [44, 10, 26], [12, 12, 20]];
        g.beginPath();
        for (const [px, py, r] of puffs) { g.moveTo(x + (px + r) * s, y + py * s); g.arc(x + px * s, y + py * s, r * s, 0, Math.PI * 2); }
        g.stroke(); g.fill();
    }
    function building(g, x, w, top, base, color, windowColor, rnd, detail) {
        const h = base - top;
        g.fillStyle = color; g.fillRect(x, top, w, h);
        halftone(g, x + w * 0.55, top, w * 0.45, h, "rgba(0,0,0,0.28)", 7, 2.6, "right");
        // roof details
        const roof = rnd();
        if (roof < 0.3) {          // water tower
            const cx = x + w * (0.3 + rnd() * 0.4);
            g.fillStyle = "#c46a3c";
            g.fillRect(cx - 14, top - 34, 28, 22);
            g.strokeRect(cx - 14, top - 34, 28, 22);
            g.beginPath(); g.moveTo(cx - 18, top - 34); g.lineTo(cx, top - 48); g.lineTo(cx + 18, top - 34); g.closePath(); g.fill(); g.stroke();
            g.beginPath(); g.moveTo(cx - 10, top - 12); g.lineTo(cx - 10, top); g.moveTo(cx + 10, top - 12); g.lineTo(cx + 10, top); g.stroke();
        } else if (roof < 0.55) {  // antenna
            const cx = x + w * (0.2 + rnd() * 0.6);
            g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, top - 40); g.stroke();
            g.fillStyle = "#ff3b3b"; g.beginPath(); g.arc(cx, top - 42, 4, 0, Math.PI * 2); g.fill(); g.stroke();
        } else if (roof < 0.75) {  // stepped top
            g.fillStyle = color;
            g.fillRect(x + w * 0.2, top - 18, w * 0.6, 18); g.strokeRect(x + w * 0.2, top - 18, w * 0.6, 18);
        }
        // windows
        if (detail) {
            const cols = Math.max(2, Math.floor((w - 16) / 22));
            const gapX = (w - cols * 12) / (cols + 1);
            for (let wy = top + 16; wy < base - 26; wy += 26) {
                for (let i = 0; i < cols; i++) {
                    const wx = x + gapX + i * (12 + gapX);
                    g.fillStyle = rnd() < 0.35 ? windowColor : "#1f2a5a";
                    g.fillRect(wx, wy, 12, 16);
                    g.lineWidth = 2; g.strokeRect(wx, wy, 12, 16);
                }
            }
        } else {
            g.fillStyle = "rgba(255,255,255,0.35)";
            for (let wy = top + 12; wy < base - 12; wy += 18) g.fillRect(x + 6, wy, w - 12, 5);
        }
        g.lineWidth = 3; g.strokeStyle = OUTLINE; g.strokeRect(x, top, w, h);
    }

    let layers = {};
    function buildScenery() {
        const rnd = mulberry(2026);
        layers.sky = makeLayer(VW, GROUND, (g, w, h) => {
            const grad = g.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#5ec4ff"); grad.addColorStop(1, "#c9f0ff");
            g.fillStyle = grad; g.fillRect(0, 0, w, h);
            halftone(g, 0, 0, w, h * 0.7, "rgba(255,255,255,0.35)", 12, 3.2, "down");
            // comic sun with burst
            const sx = 800, sy = 70;
            g.fillStyle = "#fff3a8";
            g.beginPath();
            for (let i = 0; i < 24; i++) {
                const a = i * Math.PI / 12, r = i % 2 ? 58 : 74;
                g.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r);
            }
            g.closePath(); g.fill();
            g.fillStyle = "#ffe066"; g.strokeStyle = OUTLINE; g.lineWidth = 3;
            g.beginPath(); g.arc(sx, sy, 40, 0, Math.PI * 2); g.fill(); g.stroke();
        });
        layers.clouds = makeLayer(1800, 160, (g, w) => {
            for (let x = 60; x < w - 140; x += 260 + rnd() * 200) cloud(g, x, 40 + rnd() * 70, 0.7 + rnd() * 0.5);
        });
        layers.far = makeLayer(1600, GROUND, (g, w, h) => {
            g.strokeStyle = OUTLINE; g.lineWidth = 3;
            const cols = ["#6c7bff", "#9b7dff", "#5aa9e6", "#7f8cff"];
            let x = 0;
            while (x < w - 40) {
                const bw = 60 + rnd() * 70;
                const bwSafe = Math.min(bw, w - x - 2);
                building(g, x, bwSafe, h - 120 - rnd() * 130, h + 4, cols[Math.floor(rnd() * cols.length)], "#ffe066", rnd, false);
                x += bwSafe + rnd() * 14;
            }
        });
        layers.near = makeLayer(2000, GROUND, (g, w, h) => {
            g.strokeStyle = OUTLINE; g.lineWidth = 3;
            const cols = ["#ff4d4d", "#ff9f1c", "#2ec4b6", "#ff5da2", "#3a86ff", "#8ac926"];
            let x = 10;
            while (x < w - 60) {
                const bw = Math.min(90 + rnd() * 90, w - x - 4);
                building(g, x, bw, h - 90 - rnd() * 110, h + 4, cols[Math.floor(rnd() * cols.length)], "#fff176", rnd, true);
                x += bw + 26 + rnd() * 50;
            }
        });
    }

    // street (scrolls at full speed)
    function drawStreet(offset) {
        // sidewalk
        ctx.fillStyle = "#c7cbe0"; ctx.fillRect(0, GROUND, VW, 22);
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(VW, GROUND); ctx.stroke();
        ctx.lineWidth = 2;
        for (let x = -(offset % 60); x < VW; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x, GROUND + 22); ctx.stroke();
        }
        // curb + road
        ctx.fillStyle = "#ffd23f"; ctx.fillRect(0, GROUND + 22, VW, 6);
        ctx.fillStyle = "#3a3f63"; ctx.fillRect(0, GROUND + 28, VW, VH - GROUND - 28);
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, GROUND + 22); ctx.lineTo(VW, GROUND + 22); ctx.moveTo(0, GROUND + 28); ctx.lineTo(VW, GROUND + 28); ctx.stroke();
        ctx.fillStyle = "#fffdf4";
        for (let x = -(offset * 1.0 % 120); x < VW; x += 120) {
            ctx.fillRect(x, GROUND + 52, 60, 8);
            ctx.strokeRect(x, GROUND + 52, 60, 8);
        }
        // speed lines on the road
        ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            const x = VW - ((offset * 1.6 + i * 260) % (VW + 200));
            ctx.beginPath(); ctx.moveTo(x, GROUND + 38 + i * 9); ctx.lineTo(x + 80, GROUND + 38 + i * 9); ctx.stroke();
        }
    }
    function drawTiled(img, offset, y) {
        const w = img.width;
        let x = -(offset % w);
        for (; x < VW; x += w) ctx.drawImage(img, Math.round(x), y);
    }

    // ---------------- Obstacles (yellow race gear) ---------------------
    const OBSTACLE_TYPES = [
        { name: "cone",    w: 30, h: 40, hit: { dx: 6, dy: 4, w: 18, h: 36 } },
        { name: "hurdle",  w: 44, h: 50, hit: { dx: 2, dy: 2, w: 40, h: 48 } },
        { name: "barrier", w: 54, h: 42, hit: { dx: 4, dy: 2, w: 46, h: 40 } },
        { name: "tires",   w: 36, h: 56, hit: { dx: 3, dy: 3, w: 30, h: 53 } }
    ];
    const Y1 = "#ffd23f", Y2 = "#f2a900";
    function drawObstacle(o) {
        const x = Math.round(o.x), b = GROUND, t = o.type;
        ctx.save();
        ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.lineJoin = "round";
        if (t.name === "cone") {
            ctx.fillStyle = Y1;
            ctx.beginPath(); ctx.moveTo(x + 4, b - 4); ctx.lineTo(x + 12, b - t.h); ctx.lineTo(x + 18, b - t.h); ctx.lineTo(x + 26, b - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#fffdf4"; ctx.fillRect(x + 9, b - 26, 12, 6); ctx.strokeRect(x + 9, b - 26, 12, 6);
            ctx.fillStyle = Y2; ctx.fillRect(x, b - 6, 30, 6); ctx.strokeRect(x, b - 6, 30, 6);
        } else if (t.name === "hurdle") {
            ctx.fillStyle = Y1;
            ctx.fillRect(x + 3, b - t.h, 6, t.h); ctx.strokeRect(x + 3, b - t.h, 6, t.h);
            ctx.fillRect(x + t.w - 9, b - t.h, 6, t.h); ctx.strokeRect(x + t.w - 9, b - t.h, 6, t.h);
            ctx.fillRect(x, b - t.h, t.w, 14); ctx.strokeRect(x, b - t.h, t.w, 14);
            ctx.fillStyle = OUTLINE;
            for (let i = 0; i < 3; i++) ctx.fillRect(x + 6 + i * 13, b - t.h + 1, 6, 12);
            ctx.fillStyle = Y2; ctx.fillRect(x - 2, b - 5, 14, 5); ctx.fillRect(x + t.w - 12, b - 5, 14, 5);
        } else if (t.name === "barrier") {
            ctx.fillStyle = Y2;
            ctx.beginPath(); ctx.moveTo(x + 6, b); ctx.lineTo(x + 14, b - t.h + 6); ctx.moveTo(x + t.w - 6, b); ctx.lineTo(x + t.w - 14, b - t.h + 6); ctx.stroke();
            ctx.fillStyle = Y1; ctx.fillRect(x, b - t.h, t.w, 18); ctx.strokeRect(x, b - t.h, t.w, 18);
            ctx.save(); ctx.beginPath(); ctx.rect(x, b - t.h, t.w, 18); ctx.clip();
            ctx.fillStyle = OUTLINE;
            for (let i = -18; i < t.w; i += 14) { ctx.beginPath(); ctx.moveTo(x + i, b - t.h + 18); ctx.lineTo(x + i + 7, b - t.h + 18); ctx.lineTo(x + i + 25, b - t.h); ctx.lineTo(x + i + 18, b - t.h); ctx.closePath(); ctx.fill(); }
            ctx.restore();
            ctx.strokeRect(x, b - t.h, t.w, 18);
            ctx.fillStyle = "#ff3b3b"; ctx.beginPath(); ctx.arc(x + t.w / 2, b - t.h - 4, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (t.name === "tires") {
            for (let i = 0; i < 3; i++) {
                const ty = b - 18 - i * 18;
                ctx.fillStyle = i % 2 ? Y2 : Y1;
                ctx.beginPath(); ctx.ellipse(x + t.w / 2, ty + 9, t.w / 2, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = OUTLINE; ctx.beginPath(); ctx.ellipse(x + t.w / 2, ty + 9, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
            }
        }
        // comic shine
        ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + 6, b - t.h + 6); ctx.lineTo(x + 6, b - t.h + 14); ctx.stroke();
        ctx.restore();
    }

    // ---------------- State --------------------------------------------
    let frames = [];
    const cat = { y: 0, vy: 0, grounded: true, runTimer: 0, frame: 0, landTimer: 0, jumpBuffer: 0 };
    let state = "ready";          // ready | running | over
    let elapsed = 0, distance = 0, speed = START_SPEED, obstacles = [], nextGap = 0, overAt = 0;
    let best = 0;
    try { best = parseFloat(localStorage.getItem("catDashBest")) || 0; } catch (e) { best = 0; }
    showBest();

    function showBest() { bestEl.textContent = best > 0 ? `Best ${formatTime(best)}` : ""; }

    function reset() {
        cat.y = 0; cat.vy = 0; cat.grounded = true; cat.frame = 0; cat.runTimer = 0; cat.landTimer = 0; cat.jumpBuffer = 0;
        elapsed = 0; distance = 0; speed = START_SPEED; obstacles = [];
        nextGap = VW * 0.9;               // first obstacle appears after a short run
        messageEl.classList.remove("show");
        timerEl.textContent = formatTime(0);
    }

    function difficulty() { return Math.min(1, elapsed / RAMP_TIME); }
    function randomGap() {
        const d = difficulty();
        const min = lerp(GAP_START.min, GAP_LIMIT.min, d);
        const max = lerp(GAP_START.max, GAP_LIMIT.max, d);
        // bias toward the short end as the run goes on
        const r = Math.pow(Math.random(), 1 + d);
        return (min + (max - min) * r) * CAT_W;
    }
    function spawnObstacle() {
        const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
        obstacles.push({ x: VW + 10, type });
    }

    // ---------------- Input: Space only --------------------------------
    window.addEventListener("keydown", (e) => {
        if (e.code !== "Space") return;
        e.preventDefault();
        if (e.repeat) return;
        if (state === "ready") { reset(); state = "running"; doJumpRequest(); return; }
        if (state === "over") {
            if (performance.now() - overAt > 500) { reset(); state = "running"; }
            return;
        }
        doJumpRequest();
    });
    function doJumpRequest() { cat.jumpBuffer = JUMP_BUFFER; }

    // ---------------- Update -------------------------------------------
    function update(dt) {
        if (state !== "running") return;
        elapsed += dt;
        speed = lerp(START_SPEED, MAX_SPEED, difficulty());
        const move = speed * dt;
        distance += move;

        // jumping
        cat.jumpBuffer = Math.max(0, cat.jumpBuffer - dt);
        if (cat.jumpBuffer > 0 && cat.grounded) {
            cat.vy = -JUMP_SPEED; cat.grounded = false; cat.jumpBuffer = 0;
        }
        if (!cat.grounded) {
            cat.vy += GRAVITY * dt;
            cat.y += cat.vy * dt;
            if (cat.y >= 0) { cat.y = 0; cat.vy = 0; cat.grounded = true; cat.landTimer = 0.1; }
        }
        cat.landTimer = Math.max(0, cat.landTimer - dt);

        // running animation (faster when the street is faster)
        if (cat.grounded) {
            cat.runTimer += dt;
            const fps = 8 + speed / 40;
            if (cat.runTimer >= 1 / fps) { cat.runTimer = 0; cat.frame = (cat.frame + 1) % frames.length; }
        }

        // obstacles
        for (const o of obstacles) o.x -= move;
        obstacles = obstacles.filter(o => o.x + o.type.w > -20);
        const last = obstacles[obstacles.length - 1];
        const spaceSinceLast = last ? VW + 10 - (last.x + last.type.w) : Infinity;
        if (!last ? (nextGap -= move) <= 0 : spaceSinceLast >= nextGap) {
            spawnObstacle();
            nextGap = randomGap();
        }

        // collision
        const cx = CAT_X - HIT.w / 2, cy = GROUND + cat.y - HIT.h;
        for (const o of obstacles) {
            const h = o.type.hit;
            const ox = o.x + h.dx, oy = GROUND - o.type.h + h.dy;
            if (cx < ox + h.w && cx + HIT.w > ox && cy < oy + h.h && cy + HIT.h > oy) {
                gameOver();
                break;
            }
        }
    }

    function gameOver() {
        state = "over";
        overAt = performance.now();
        messageEl.classList.add("show");
        if (elapsed > best) {
            best = elapsed;
            try { localStorage.setItem("catDashBest", String(best)); } catch (e) { /* ignore */ }
            showBest();
        }
    }

    // ---------------- Render -------------------------------------------
    const JUMP_POSES = [
        { frame: 1, sx: 0.92, sy: 1.10, rot: -0.06 },  // take-off
        { frame: 1, sx: 0.96, sy: 1.05, rot: -0.12 },  // rising
        { frame: 3, sx: 1.00, sy: 1.00, rot: 0.00 },   // top
        { frame: 2, sx: 1.03, sy: 0.98, rot: 0.10 },   // falling
        { frame: 0, sx: 1.14, sy: 0.86, rot: 0.00 }    // landing squash
    ];
    function catPose() {
        if (cat.landTimer > 0) return JUMP_POSES[4];
        if (cat.grounded) return { frame: cat.frame, sx: 1, sy: 1, rot: 0 };
        if (cat.vy < -JUMP_SPEED * 0.7) return JUMP_POSES[0];
        if (cat.vy < -140) return JUMP_POSES[1];
        if (cat.vy < 140) return JUMP_POSES[2];
        return JUMP_POSES[3];
    }

    function bannerText(lines) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = `48px Bangers, Impact, "Arial Black", sans-serif`;
        const w = 420, h = lines.length > 1 ? 110 : 76, x = VW / 2 - w / 2, y = 120;
        ctx.fillStyle = OUTLINE; ctx.fillRect(x + 6, y + 6, w, h);
        ctx.fillStyle = lines[0].color; ctx.fillRect(x, y, w, h);
        ctx.lineWidth = 4; ctx.strokeStyle = OUTLINE; ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = "#fffdf4"; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 5;
        ctx.strokeText(lines[0].text, VW / 2, y + 56); ctx.fillText(lines[0].text, VW / 2, y + 56);
        if (lines[1]) {
            ctx.font = `22px Bangers, Impact, "Arial Black", sans-serif`;
            ctx.fillStyle = OUTLINE; ctx.fillText(lines[1].text, VW / 2, y + 92);
        }
        ctx.restore();
    }

    function render() {
        ctx.drawImage(layers.sky, 0, 0);
        drawTiled(layers.clouds, distance * 0.08, 20);
        drawTiled(layers.far, distance * 0.2, 0);
        drawTiled(layers.near, distance * 0.45, 0);
        drawStreet(distance);

        for (const o of obstacles) drawObstacle(o);

        // shadow
        const shadowScale = 1 - Math.min(0.6, -cat.y / 180);
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath(); ctx.ellipse(CAT_X, GROUND + 3, 22 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

        // cat
        const p = catPose();
        ctx.save();
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        ctx.translate(CAT_X, GROUND + cat.y + 1);
        ctx.rotate(p.rot);
        ctx.scale(p.sx, p.sy);
        ctx.drawImage(frames[p.frame], SRC.x, SRC.y, SRC.w, SRC.h, -BODY_CENTER, -CAT_H, CAT_W, CAT_H);
        ctx.restore();

        if (state === "ready") bannerText([{ text: "Cat Dash!", color: "#3a86ff" }, { text: "Press Space to start" }]);
        if (state === "over")  bannerText([{ text: "Game over!", color: "#ff3b3b" }, { text: "Press Space to run again" }]);

        timerEl.textContent = formatTime(elapsed);
    }

    // ---------------- Loop ---------------------------------------------
    let lastTs = 0;
    function loop(ts) {
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
        lastTs = ts;
        // small fixed sub-steps keep jumps and hits consistent
        let remaining = dt;
        while (remaining > 0) { const s = Math.min(remaining, 1 / 120); update(s); remaining -= s; }
        render();
        requestAnimationFrame(loop);
    }

    Promise.all(FRAME_SOURCES.map(loadImage)).then(imgs => {
        frames = imgs;
        buildScenery();
        reset();
        requestAnimationFrame(loop);
        // redraw text once the comic font arrives
        if (document.fonts) document.fonts.ready.then(() => render());
    }).catch(err => {
        console.error(err);
        ctx.fillStyle = "#111"; ctx.font = "20px sans-serif";
        ctx.fillText("The cat sprites could not be loaded.", 30, 50);
    });

    window.__runner = { update, start(){reset(); state="running";}, get state() { return state; }, get obstacles() { return obstacles; }, cat, get elapsed() { return elapsed; }, CAT_X, HIT, GROUND };
    </script>
</body>
</html>
